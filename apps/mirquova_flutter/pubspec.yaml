name: mirquova
description: Local-first device discovery foundation for Mirquova.
publish_to: none
version: 0.3.0+3
environment:
  sdk: ^3.13.7
dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.4
  crypto: ^3.0.7
  flutter_secure_storage: 11.2.0
  qr: 4.0.0
  mobile_scanner: 7.4.2
  file_picker: ^13.3.0
  video_player: ^2.14.1
  # 2.12.2 and later call AVAsset.load(_:isolation:), which the iOS SDK on
  # the macOS 15 runner rejects. 2.12.1 is the last build that compiles there.
  video_player_avfoundation: 2.12.1
  video_player_win: ^3.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
