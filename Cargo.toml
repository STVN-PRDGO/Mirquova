[workspace]
members = ["crates/mirquova-core"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false

[workspace.dependencies]
aws-lc-rs = "=1.18.2"
mdns-sd = "=0.21.6"
getrandom = "=0.4.3"
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs", "x509-parser", "zeroize"] }
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "=0.6.5"
subtle = "=2.6.1"
uuid = { version = "1.29.0", features = ["v4"] }
x509-parser = "=0.18.1"
zeroize = "=1.9.1"
