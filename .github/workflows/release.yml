name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Optional release tag, such as v0.3.6. Leave empty to use the next patch.'
        required: false
        default: ''

concurrency:
  group: release-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  version:
    name: Next release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release_tag.outputs.tag }}
      build_name: ${{ steps.release_tag.outputs.build_name }}
      build_number: ${{ steps.release_tag.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Choose the next stable tag
        id: release_tag
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          git fetch origin --tags
          python3 - <<'PY'
          import os, re, subprocess
          pattern = re.compile(r"^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:\+([0-9]+))?$")
          requested = os.environ.get("REQUESTED_TAG", "").strip()
          if requested:
              tag = requested
          else:
              raw = subprocess.check_output(["git", "tag", "-l", "v*"], text=True)
              best = (0, 0, 0)
              for line in raw.splitlines():
                  match = pattern.fullmatch(line.strip())
                  if not match:
                      continue
                  current = tuple(int(match.group(i)) for i in range(1, 4))
                  if current > best:
                      best = current
              tag = f"v{best[0]}.{best[1]}.{best[2] + 1}"
          match = pattern.fullmatch(tag)
          if not match:
              raise SystemExit("Expected a stable release tag such as v0.3.6.")
          name = f"{match.group(1)}.{match.group(2)}.{match.group(3)}"
          number = match.group(4) or match.group(3)
          if subprocess.call(["git", "rev-parse", "-q", "--verify", f"refs/tags/{tag}"], stdout=subprocess.DEVNULL) == 0:
              raise SystemExit(f"Tag {tag} already exists.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"tag={tag}\nbuild_name={name}\nbuild_number={number}\n")
          print(f"Next release {tag} ({name}+{number})")
          PY

  windows:
    name: Build Windows Release Package
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      MIRQUOVA_BUILD_NAME: ${{ needs.version.outputs.build_name }}
      MIRQUOVA_BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Build Rust core release library
        run: cargo build -p mirquova-core --lib --release --locked
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Get Flutter dependencies
        working-directory: apps/mirquova_flutter
        run: flutter pub get --enforce-lockfile
      - name: Build Flutter Windows release runner
        working-directory: apps/mirquova_flutter
        shell: powershell
        run: |
          $coreDll = (Join-Path $env:GITHUB_WORKSPACE 'target/release/mirquova_core.dll') -replace '\\', '/'
          if (-not (Test-Path -LiteralPath $coreDll)) {
            throw "Native library not found at $coreDll"
          }
          $env:MIRQUOVA_CORE_BUNDLE = $coreDll
          flutter build windows --release --build-name $env:MIRQUOVA_BUILD_NAME --build-number $env:MIRQUOVA_BUILD_NUMBER
      - name: Package Windows ZIP
        shell: powershell
        run: |
          Compress-Archive -Path apps/mirquova_flutter/build/windows/x64/runner/Release/* -DestinationPath Mirquova-preview-windows-x64.zip
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: Mirquova-preview-windows-x64.zip

  android:
    name: Build Android APK
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MIRQUOVA_BUILD_NAME: ${{ needs.version.outputs.build_name }}
      MIRQUOVA_BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
      - name: Setup Android NDK and cargo-ndk
        run: |
          echo y | sdkmanager 'ndk;28.2.13676358'
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build native Rust Android core
        run: |
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" cargo ndk -t arm64-v8a -t x86_64 --platform 24 -o apps/mirquova_flutter/android/app/src/main/jniLibs build --lib --release --locked
      - name: Get Flutter dependencies
        working-directory: apps/mirquova_flutter
        run: flutter pub get --enforce-lockfile
      - name: Build Flutter Android APK
        working-directory: apps/mirquova_flutter
        run: flutter build apk --debug --build-name "$MIRQUOVA_BUILD_NAME" --build-number "$MIRQUOVA_BUILD_NUMBER" --target-platform android-arm64,android-x64
      - name: Copy Android APK
        run: cp apps/mirquova_flutter/build/app/outputs/flutter-apk/app-debug.apk Mirquova-preview-android-arm64-debug.apk
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: Mirquova-preview-android-arm64-debug.apk

  linux:
    name: Build Linux Release Package
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MIRQUOVA_BUILD_NAME: ${{ needs.version.outputs.build_name }}
      MIRQUOVA_BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Install Linux build prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libstdc++-12-dev xvfb dbus-x11 gnome-keyring
      - name: Build Flutter and Rust Linux release bundle
        run: bash scripts/Build-Linux.sh
      - name: Verify bundled native core and app metadata
        working-directory: apps/mirquova_flutter
        run: xvfb-run -a dbus-run-session -- bash -c 'echo "" | gnome-keyring-daemon --unlock --daemonize --components=secrets; flutter test integration_test/native_app_platform_test.dart -d linux --no-pub --dart-define=MIRQUOVA_CORE_LIBRARY=$GITHUB_WORKSPACE/target/release/libmirquova_core.so'
      - name: Package Linux tarball
        run: |
          test -f apps/mirquova_flutter/build/linux/x64/release/bundle/lib/libmirquova_core.so
          tar -czf Mirquova-preview-linux-x64.tar.gz -C apps/mirquova_flutter/build/linux/x64/release/bundle .
          sha256sum Mirquova-preview-linux-x64.tar.gz > Mirquova-preview-linux-x64.sha256
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            Mirquova-preview-linux-x64.tar.gz
            Mirquova-preview-linux-x64.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [version, windows, android, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: windows-release
      - name: Download Android package
        uses: actions/download-artifact@v4
        with:
          name: android-release
      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: linux-release
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          cat > release-notes.md <<'TXT'
          ### Mirquova development preview

          #### Downloads
          - **Windows (x64)**: Extract `Mirquova-preview-windows-x64.zip` completely and run `mirquova.exe`. Keep all bundled files together.
          - **Android**: Install `Mirquova-preview-android-arm64-debug.apk`. It contains ARM64 and x64 code and is a debug-signed phone preview. It is not a TV app.
          - **Linux (x64)**: Extract `Mirquova-preview-linux-x64.tar.gz`, keep the entire bundle together, and run `./mirquova`. Built on Ubuntu 24.04; requires GTK3 and compatible system libraries.

          #### Notes
          - iOS and macOS packages are not part of this release.
          - Preview functionality includes consented LAN presence and discovery of unverified candidates. Pairing is a short-lived, fingerprint-confirmed TLS preview with host approval, and has not passed cross-device QA.
          - Native builds do not establish physical-device installation, permission behavior, or two-device pairing. Production signing and distribution QA remain pending.
          - Linux packages include third-party notices and an adjacent SHA-256 checksum file.
          TXT
          gh release create "$TAG" \
            Mirquova-preview-windows-x64.zip \
            Mirquova-preview-android-arm64-debug.apk \
            Mirquova-preview-linux-x64.tar.gz \
            Mirquova-preview-linux-x64.sha256 \
            --target "$GITHUB_SHA" \
            --title "Mirquova Preview $TAG" \
            --notes-file release-notes.md
