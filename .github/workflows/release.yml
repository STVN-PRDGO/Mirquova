name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.3.0)'
        required: true
        default: 'v0.3.0'

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows Release Package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Build Rust core release library
        run: cargo build -p mirquova-core --lib --release --locked
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Get Flutter dependencies
        working-directory: apps/mirquova_flutter
        run: flutter pub get --enforce-lockfile
      - name: Build Flutter Windows release runner
        working-directory: apps/mirquova_flutter
        shell: powershell
        run: |
          $coreDll = (Join-Path $env:GITHUB_WORKSPACE 'target/release/mirquova_core.dll') -replace '\\', '/'
          if (-not (Test-Path -LiteralPath $coreDll)) {
            throw "Native library not found at $coreDll"
          }
          $env:MIRQUOVA_CORE_BUNDLE = $coreDll
          flutter build windows --release
      - name: Package Windows ZIP
        shell: powershell
        run: |
          Compress-Archive -Path apps/mirquova_flutter/build/windows/x64/runner/Release/* -DestinationPath Mirquova-preview-windows-x64.zip
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: Mirquova-preview-windows-x64.zip

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: aarch64-linux-android
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
      - name: Setup Android NDK and cargo-ndk
        run: |
          echo y | sdkmanager 'ndk;28.2.13676358'
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build native Rust Android core
        run: |
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" cargo ndk -t arm64-v8a --platform 24 -o apps/mirquova_flutter/android/app/src/main/jniLibs build --lib --release --locked
      - name: Get Flutter dependencies
        working-directory: apps/mirquova_flutter
        run: flutter pub get --enforce-lockfile
      - name: Build Flutter Android APK
        working-directory: apps/mirquova_flutter
        run: flutter build apk --debug --target-platform android-arm64
      - name: Copy Android APK
        run: cp apps/mirquova_flutter/build/app/outputs/flutter-apk/app-debug.apk Mirquova-preview-android-arm64-debug.apk
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: Mirquova-preview-android-arm64-debug.apk

  macos:
    name: Build macOS Release Package
    runs-on: macos-15
    env:
      MIRQUOVA_GOLDEN_PROFILE: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: aarch64-apple-darwin
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Build and verify macOS app bundle
        run: bash scripts/Build-macOS.sh
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            artifacts/iteration-04/Mirquova-preview-macos-arm64.zip
            artifacts/iteration-04/Mirquova-preview-macos-arm64.sha256
          if-no-files-found: error

  linux:
    name: Build Linux Release Package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Install Linux build prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev xvfb
      - name: Build Flutter and Rust Linux release bundle
        run: bash scripts/Build-Linux.sh
      - name: Verify bundled native core and app metadata
        working-directory: apps/mirquova_flutter
        run: xvfb-run -a flutter test integration_test/native_app_platform_test.dart -d linux --no-pub
      - name: Package Linux tarball
        run: |
          test -f apps/mirquova_flutter/build/linux/x64/release/bundle/lib/libmirquova_core.so
          tar -czf Mirquova-preview-linux-x64.tar.gz -C apps/mirquova_flutter/build/linux/x64/release/bundle .
          sha256sum Mirquova-preview-linux-x64.tar.gz > Mirquova-preview-linux-x64.sha256
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            Mirquova-preview-linux-x64.tar.gz
            Mirquova-preview-linux-x64.sha256
          if-no-files-found: error

  ios:
    name: Build iOS Unsigned Device App
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: aarch64-apple-ios
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Build unsigned iOS app and verify Rust ABI exports
        run: bash scripts/Build-iOS.sh device
      - name: Package iOS device app with notices
        run: |
          mkdir -p artifacts/Mirquova-ios-arm64-unsigned
          ditto apps/mirquova_flutter/build/ios/iphoneos/Runner.app artifacts/Mirquova-ios-arm64-unsigned/Runner.app
          cp THIRD_PARTY_NOTICES.md artifacts/Mirquova-ios-arm64-unsigned/
          ditto third_party artifacts/Mirquova-ios-arm64-unsigned/third_party
          cat > artifacts/Mirquova-ios-arm64-unsigned/README.txt <<'TXT'
          Unsigned Mirquova iOS ARM64 device app for development.
          This ZIP is not an installable IPA or a simulator build.
          Device installation requires Apple signing and a provisioning profile.
          LAN discovery additionally requires Apple's approved multicast entitlement
          and local-network permission. No physical iPhone testing is claimed.
          See docs/build-and-run.md in the source repository for signed IPA builds.
          TXT
          ditto -c -k --keepParent artifacts/Mirquova-ios-arm64-unsigned Mirquova-preview-ios-arm64-unsigned.zip
          shasum -a 256 Mirquova-preview-ios-arm64-unsigned.zip > Mirquova-preview-ios-arm64-unsigned.sha256
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: |
            Mirquova-preview-ios-arm64-unsigned.zip
            Mirquova-preview-ios-arm64-unsigned.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [windows, android, macos, linux, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: windows-release
      - name: Download Android package
        uses: actions/download-artifact@v4
        with:
          name: android-release
      - name: Download macOS package
        uses: actions/download-artifact@v4
        with:
          name: macos-release
      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: linux-release
      - name: Download iOS package
        uses: actions/download-artifact@v4
        with:
          name: ios-release
      - name: Determine tag name
        id: release_tag
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${REQUESTED_TAG:-$REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\+[0-9]+)?$ ]]; then
            echo 'Expected a stable release tag such as v0.3.0 or v0.3.0+3.' >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          cat > release-notes.md <<'TXT'
          ### Mirquova development preview

          #### Downloads
          - **Windows (x64)**: Extract `Mirquova-preview-windows-x64.zip` completely and run `mirquova.exe`. Keep all bundled files together.
          - **Android (ARM64)**: Install `Mirquova-preview-android-arm64-debug.apk`. This is a debug-signed phone preview.
          - **macOS (Apple Silicon)**: Extract `Mirquova-preview-macos-arm64.zip` and move `mirquova.app` to Applications. If Apple cannot verify the app, click **Done**, then **System Settings → Privacy & Security → Open Anyway** for mirquova and confirm **Open**. The preview is signed ad hoc and is not notarized. Intel Macs are not supported by this package.
          - **Linux (x64)**: Extract `Mirquova-preview-linux-x64.tar.gz`, keep the entire bundle together, and run `./mirquova`. Built on Ubuntu 24.04; requires GTK3 and compatible system libraries.
          - **iOS (ARM64)**: `Mirquova-preview-ios-arm64-unsigned.zip` contains an unsigned device app for development. It is not an installable IPA. Apple signing/provisioning and multicast entitlement approval are required for device discovery builds; see the source build instructions.

          #### Notes
          - For this trusted macOS preview only, an alternative is to run `xattr -dr com.apple.quarantine /Applications/mirquova.app` followed by `open /Applications/mirquova.app` in Terminal. This removes quarantine only from this app; it does not notarize it or disable Gatekeeper globally. Changing the archive format does not resolve notarization.
          - Preview functionality includes consented LAN presence and discovery of unverified candidates. Pairing, transfers, casting and playback remain unavailable.
          - Native builds do not establish physical-device installation, permission behavior or two-device discovery. Production signing and distribution QA remain pending.
          - macOS, Linux and iOS packages include third-party notices and adjacent SHA-256 checksum files.
          TXT
          gh release create "$TAG" \
            Mirquova-preview-windows-x64.zip \
            Mirquova-preview-android-arm64-debug.apk \
            Mirquova-preview-macos-arm64.zip \
            Mirquova-preview-macos-arm64.sha256 \
            Mirquova-preview-linux-x64.tar.gz \
            Mirquova-preview-linux-x64.sha256 \
            Mirquova-preview-ios-arm64-unsigned.zip \
            Mirquova-preview-ios-arm64-unsigned.sha256 \
            --target "$GITHUB_SHA" \
            --title "Mirquova Preview $TAG" \
            --notes-file release-notes.md
