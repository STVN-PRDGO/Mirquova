name: macOS preview build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: Build and test Apple Silicon preview
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: aarch64-apple-darwin
          components: rustfmt, clippy
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Rust checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Resolve locked Flutter dependencies
        working-directory: apps/mirquova_flutter
        run: flutter pub get --enforce-lockfile
      - name: Build, verify, and package macOS app
        run: bash scripts/Build-macOS.sh
      - name: Upload verified macOS preview
        uses: actions/upload-artifact@v4
        with:
          name: Mirquova-preview-macos-arm64
          path: |
            artifacts/iteration-04/Mirquova-preview-macos-arm64.zip
            artifacts/iteration-04/Mirquova-preview-macos-arm64.sha256
          if-no-files-found: error
          retention-days: 14
