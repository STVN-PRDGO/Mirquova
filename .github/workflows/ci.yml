name: Foundation checks
on: [push, pull_request]
jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build -p mirquova-core --lib --locked
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mirquova_flutter
      - run: flutter analyze
        working-directory: apps/mirquova_flutter
      - run: flutter test --dart-define=MIRQUOVA_CORE_LIBRARY=${{ github.workspace }}/target/debug/mirquova_core.dll
        working-directory: apps/mirquova_flutter
      - run: flutter build windows --debug
        working-directory: apps/mirquova_flutter
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: aarch64-linux-android
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
      - run: sdkmanager 'ndk;28.2.13676358'
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" cargo ndk -t arm64-v8a --platform 24 -o apps/mirquova_flutter/android/app/src/main/jniLibs build --lib --release --locked
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mirquova_flutter
      - run: flutter build apk --debug --target-platform android-arm64
        working-directory: apps/mirquova_flutter
