name: Foundation checks
on: [push, pull_request]
jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build -p mirquova-core --lib --locked
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mirquova_flutter
      - run: flutter analyze
        working-directory: apps/mirquova_flutter
      # Exact golden renders use the macOS reference job below.
      - run: flutter test --exclude-tags golden --dart-define=MIRQUOVA_CORE_LIBRARY=${{ github.workspace }}/target/debug/mirquova_core.dll
        working-directory: apps/mirquova_flutter
      - run: flutter build windows --debug
        working-directory: apps/mirquova_flutter
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: aarch64-linux-android
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
      - run: sdkmanager 'ndk;28.2.13676358'
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" cargo ndk -t arm64-v8a --platform 24 -o apps/mirquova_flutter/android/app/src/main/jniLibs build --lib --release --locked
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mirquova_flutter
      - run: flutter build apk --debug --target-platform android-arm64
        working-directory: apps/mirquova_flutter
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-debug-apk
          path: |
            apps/mirquova_flutter/build/app/outputs/flutter-apk/app-debug.apk
            THIRD_PARTY_NOTICES.md
            third_party/
          if-no-files-found: error
  desktop-unix:
    env:
      MIRQUOVA_GOLDEN_PROFILE: macos-15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev xvfb
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build -p mirquova-core --lib --locked
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mirquova_flutter
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
        working-directory: apps/mirquova_flutter
      - run: flutter analyze --no-pub
        working-directory: apps/mirquova_flutter
      - name: Offline Flutter tests with native core
        shell: bash
        working-directory: apps/mirquova_flutter
        run: |
          extension=so
          if [[ "$RUNNER_OS" == macOS ]]; then extension=dylib; fi
          visual_args=()
          if [[ "$RUNNER_OS" != macOS ]]; then visual_args=(--exclude-tags golden); fi
          flutter test --no-pub "${visual_args[@]}" --dart-define=MIRQUOVA_GOLDEN_PROFILE="$MIRQUOVA_GOLDEN_PROFILE" --dart-define=MIRQUOVA_CORE_LIBRARY="$GITHUB_WORKSPACE/target/debug/libmirquova_core.$extension"
      - name: Upload visual comparison failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-comparison-${{ runner.os }}
          path: apps/mirquova_flutter/test/failures/
          if-no-files-found: ignore
      - if: runner.os == 'Linux'
        run: bash scripts/Build-Linux.sh
      - if: runner.os == 'Linux'
        run: xvfb-run -a flutter test integration_test/native_app_platform_test.dart -d linux --no-pub
        working-directory: apps/mirquova_flutter
      - if: runner.os == 'macOS'
        run: bash scripts/Build-macOS.sh
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}-preview
          path: |
            apps/mirquova_flutter/build/linux/*/release/bundle/
            artifacts/iteration-04/Mirquova-preview-macos-arm64.*
          if-no-files-found: error
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
      - run: bash scripts/Build-iOS.sh device
      - run: bash scripts/Build-iOS.sh simulator
      - name: Offline iOS simulator bridge test
        shell: bash
        working-directory: apps/mirquova_flutter
        run: |
          simulator_id="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for runtime,devices in data["devices"].items() if "iOS" in runtime for d in devices if "iPhone" in d["name"]))')"
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          python3 -c 'import subprocess,sys; subprocess.run(sys.argv[1:], check=True, timeout=600)' flutter test integration_test/native_app_platform_test.dart -d "$simulator_id" --no-pub
      - name: Package unsigned iOS app with notices
        run: |
          mkdir -p artifacts/ios-unsigned-device
          ditto apps/mirquova_flutter/build/ios/iphoneos/Runner.app artifacts/ios-unsigned-device/Runner.app
          cp THIRD_PARTY_NOTICES.md artifacts/ios-unsigned-device/
          ditto third_party artifacts/ios-unsigned-device/third_party
          ditto -c -k --keepParent artifacts/ios-unsigned-device ios-unsigned-device.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-device-app
          path: ios-unsigned-device.zip
          if-no-files-found: error
