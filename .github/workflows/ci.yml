name: Foundation checks
on: [push, pull_request]
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Select private IPv4 interface for pairing transport tests
        shell: pwsh
        run: |
          $address = [System.Net.NetworkInformation.NetworkInterface]::GetAllNetworkInterfaces() |
            ForEach-Object { $_.GetIPProperties().UnicastAddresses } |
            ForEach-Object { $_.Address } |
            Where-Object {
              if ($_.AddressFamily -ne [System.Net.Sockets.AddressFamily]::InterNetwork) { return $false }
              $bytes = $_.GetAddressBytes()
              if ($bytes[0] -eq 10 -or
                  ($bytes[0] -eq 192 -and $bytes[1] -eq 168) -or
                  ($bytes[0] -eq 172 -and $bytes[1] -ge 16 -and $bytes[1] -le 31)) {
                $_.ToString()
              }
            } | Select-Object -First 1
          if (-not $address) { throw 'No RFC1918 IPv4 interface is available for pairing tests.' }
          "MIRQUOVA_PAIRING_TEST_IPV4=$address" >> $env:GITHUB_ENV
      - name: Same-host TLS pairing transport
        run: cargo test -p mirquova-core --locked pairing_transport::tests::local_private_interface_pairing_ -- --ignored --test-threads=1
      - run: cargo build -p mirquova-core --lib --locked
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mirquova_flutter
      - run: flutter analyze
        working-directory: apps/mirquova_flutter
      # Exact golden renders use the macOS reference job below.
      - run: flutter test --exclude-tags golden --dart-define=MIRQUOVA_CORE_LIBRARY=${{ github.workspace }}/target/debug/mirquova_core.dll
        working-directory: apps/mirquova_flutter
      - run: flutter build windows --debug
        working-directory: apps/mirquova_flutter
      - name: Native pairing identity, trust and route smoke test
        run: flutter test integration_test/native_app_platform_test.dart -d windows --no-pub --dart-define=MIRQUOVA_CORE_LIBRARY=${{ github.workspace }}/target/debug/mirquova_core.dll
        working-directory: apps/mirquova_flutter
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" cargo ndk -t arm64-v8a -t x86_64 --platform 24 -o apps/mirquova_flutter/android/app/src/main/jniLibs build --lib --release --locked
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mirquova_flutter
      - run: flutter build apk --debug --target-platform android-arm64,android-x64
        working-directory: apps/mirquova_flutter
      - name: Verify pairing identity is excluded from Android backups
        shell: bash
        run: |
          manifest="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree apps/mirquova_flutter/build/app/outputs/flutter-apk/app-debug.apk AndroidManifest.xml)"
          grep -Fq 'android:allowBackup(0x01010280)=(type 0x12)0x0' <<< "$manifest"
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@v2
        name: Android emulator pairing identity, trust and route smoke test
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: cd apps/mirquova_flutter && flutter test integration_test/native_app_platform_test.dart -d emulator-5554 --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-x64-debug-apk
          path: |
            apps/mirquova_flutter/build/app/outputs/flutter-apk/app-debug.apk
            THIRD_PARTY_NOTICES.md
            third_party/
          if-no-files-found: error
  desktop-unix:
    timeout-minutes: 45
    env:
      MIRQUOVA_GOLDEN_PROFILE: macos-15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libstdc++-12-dev xvfb dbus-x11 gnome-keyring
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - if: runner.os == 'Linux'
        name: Select private IPv4 interface for pairing transport tests
        shell: bash
        run: |
          address="$(ip -o -4 addr show scope global 2>/dev/null | awk '$3 == "inet" { split($4, item, "/"); ip=item[1]; if (ip ~ /^10\./ || ip ~ /^192\.168\./ || ip ~ /^172\.(1[6-9]|2[0-9]|3[01])\./) { print ip; exit } }')"
          if [[ -z "$address" ]]; then
            address="$(hostname -I 2>/dev/null | tr ' ' '\n' | awk '/^10\./ || /^192\.168\./ || /^172\.(1[6-9]|2[0-9]|3[01])\./ { print; exit }')"
          fi
          if [[ -z "$address" ]]; then
            echo 'No RFC1918 IPv4 interface is available for pairing tests.' >&2
            hostname -I >&2 || true
            ip -o -4 addr show >&2 || true
            exit 1
          fi
          echo "MIRQUOVA_PAIRING_TEST_IPV4=$address" >> "$GITHUB_ENV"
      - if: runner.os == 'Linux'
        name: Same-host TLS pairing transport
        run: cargo test -p mirquova-core --locked pairing_transport::tests::local_private_interface_pairing_ -- --ignored --test-threads=1
      - run: cargo build -p mirquova-core --lib --locked
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mirquova_flutter
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
        working-directory: apps/mirquova_flutter
      - run: flutter analyze --no-pub
        working-directory: apps/mirquova_flutter
      - name: Offline Flutter tests with native core
        shell: bash
        working-directory: apps/mirquova_flutter
        run: |
          extension=so
          if [[ "$RUNNER_OS" == macOS ]]; then extension=dylib; fi
          visual_args=()
          if [[ "$RUNNER_OS" != macOS ]]; then visual_args=(--exclude-tags golden); fi
          test_log="$RUNNER_TEMP/macos-flutter-tests.log"
          if [[ "$RUNNER_OS" == macOS ]]; then
            set -o pipefail
            if flutter test --no-pub --reporter expanded "${visual_args[@]}" --dart-define=MIRQUOVA_GOLDEN_PROFILE="$MIRQUOVA_GOLDEN_PROFILE" --dart-define=MIRQUOVA_CORE_LIBRARY="$GITHUB_WORKSPACE/target/debug/libmirquova_core.$extension" 2>&1 | tee "$test_log"; then
              :
            else
              python3 "$GITHUB_WORKSPACE/scripts/report_flutter_test_failures.py" "$test_log" "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          else
            flutter test --no-pub "${visual_args[@]}" --dart-define=MIRQUOVA_GOLDEN_PROFILE="$MIRQUOVA_GOLDEN_PROFILE" --dart-define=MIRQUOVA_CORE_LIBRARY="$GITHUB_WORKSPACE/target/debug/libmirquova_core.$extension"
          fi
      - name: Upload visual comparison failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-comparison-${{ runner.os }}
          path: apps/mirquova_flutter/test/failures/
          if-no-files-found: ignore
      - name: Upload macOS Flutter test log
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-flutter-test-log
          path: ${{ runner.temp }}/macos-flutter-tests.log
          if-no-files-found: ignore
      - if: runner.os == 'Linux'
        run: bash scripts/Build-Linux.sh
      - if: runner.os == 'Linux'
        name: Linux pairing identity, trust and route smoke test
        run: xvfb-run -a dbus-run-session -- bash -c 'echo "" | gnome-keyring-daemon --unlock --daemonize --components=secrets; flutter test integration_test/native_app_platform_test.dart -d linux --no-pub --dart-define=MIRQUOVA_CORE_LIBRARY=$GITHUB_WORKSPACE/target/release/libmirquova_core.so'
        working-directory: apps/mirquova_flutter
      - if: runner.os == 'macOS'
        name: Build macOS preview
        env:
          MIRQUOVA_SKIP_NATIVE_SMOKE: '1'
        run: bash scripts/Build-macOS.sh
      - if: runner.os == 'macOS'
        name: macOS native bridge, keychain and Pair route smoke test
        shell: bash
        working-directory: apps/mirquova_flutter
        run: python3 -c 'import subprocess,sys; subprocess.run(sys.argv[1:], check=True, timeout=300)' flutter --suppress-analytics --no-version-check test integration_test/native_app_platform_test.dart -d macos --no-pub --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}-preview
          path: |
            apps/mirquova_flutter/build/linux/*/release/bundle/
            artifacts/iteration-04/Mirquova-preview-macos-arm64.*
          if-no-files-found: error
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
      - run: bash scripts/Build-iOS.sh device
      - run: bash scripts/Build-iOS.sh simulator
      - name: Select iOS simulator for native smoke test
        id: ios-simulator
        shell: bash
        run: |
          simulator_id="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for runtime,devices in data["devices"].items() if "iOS" in runtime for d in devices if "iPhone" in d["name"]))')"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
          echo "Selected iOS simulator: $simulator_id"
      - name: Boot iOS simulator
        shell: bash
        env:
          SIMULATOR_ID: ${{ steps.ios-simulator.outputs.id }}
        run: |
          echo "Booting iOS simulator $SIMULATOR_ID"
          xcrun simctl boot "$SIMULATOR_ID" || xcrun simctl list devices booted | grep -q "$SIMULATOR_ID"
          python3 -c 'import subprocess,sys; subprocess.run(sys.argv[1:], check=True, timeout=180)' xcrun simctl bootstatus "$SIMULATOR_ID" -b
          echo "iOS simulator boot completed: $SIMULATOR_ID"
      - name: iOS native bridge, keychain and Pair route smoke test
        shell: bash
        working-directory: apps/mirquova_flutter
        env:
          SIMULATOR_ID: ${{ steps.ios-simulator.outputs.id }}
        run: |
          echo "Starting native iOS pairing smoke test on $SIMULATOR_ID"
          set -o pipefail
          python3 -c 'import subprocess,sys; subprocess.run(sys.argv[1:], check=True, timeout=300)' flutter test integration_test/native_app_platform_test.dart -d "$SIMULATOR_ID" --no-pub --verbose 2>&1 | tee "$RUNNER_TEMP/ios-native-smoke.log"
          echo "Native iOS pairing smoke test passed."
      - name: Upload iOS native smoke log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-smoke-log
          path: ${{ runner.temp }}/ios-native-smoke.log
          if-no-files-found: ignore
      - name: Package unsigned iOS app with notices
        run: |
          mkdir -p artifacts/ios-unsigned-device
          ditto apps/mirquova_flutter/build/ios/iphoneos/Runner.app artifacts/ios-unsigned-device/Runner.app
          cp THIRD_PARTY_NOTICES.md artifacts/ios-unsigned-device/
          ditto third_party artifacts/ios-unsigned-device/third_party
          ditto -c -k --keepParent artifacts/ios-unsigned-device ios-unsigned-device.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-device-app
          path: ios-unsigned-device.zip
          if-no-files-found: error
